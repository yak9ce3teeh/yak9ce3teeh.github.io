    :root { color-scheme: light; --bg: #f6f5f1; --ink: #202c2a; --muted: #606c68; --accent: #275e50; --line: #dedfd8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 "Segoe UI", system-ui, sans-serif; }
    main { max-width: 880px; margin: auto; padding: clamp(70px, 17vh, 180px) 32px 80px; }

    .entry:hover { border-color: var(--accent); }
    .entry:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .entry-title { display: block; color: var(--accent); font-size: 16px; font-weight: 600; }
    .entry-description { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
    .arrow { color: var(--accent); font-size: 20px; }
    @media (max-width: 600px) { main { padding: 75px 22px; } .entry { margin-top: 36px; padding: 18px; } }
  </style>
